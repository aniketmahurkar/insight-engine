name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Seed demo database
        run: python demo/seed_demo_db.py
      - name: Run analysis (fallback mode)
        run: python demo/run_analysis.py
      - name: Verify report generated
        run: test -f reports/report.md
      - name: Run validator smoke test
        run: python -c "from src.validator import validate_metric; r = validate_metric('AHT', 360, 365); assert r.within_tolerance"
      - name: Run alerts smoke test
        run: python -c "from src.alerts import analyze_recurring_flags; analyze_recurring_flags('metrics_log.jsonl')"
